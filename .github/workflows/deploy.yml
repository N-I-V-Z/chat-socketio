name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. BUILD & PUSH CLIENT
      - name: Build and push Client Docker image
        run: |
          docker build --pull --no-cache \
            --build-arg REACT_APP_API_ROOT="${{ secrets.REACT_APP_API_ROOT }}" \
            --build-arg CLIENT_URL="${{ secrets.CLIENT_URL }}" \
            -t nivz0911/chat-socketio-client:latest ./client
          docker push nivz0911/chat-socketio-client:latest

      # 2. BUILD & PUSH SERVER
      - name: Build and push Server Docker image
        run: |
          docker build --pull --no-cache -t nivz0911/chat-socketio-server:latest ./server
          docker push nivz0911/chat-socketio-server:latest

      # 3. DEPLOY LÊN VPS
      - name: Deploy to VPS via SSH
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

        run: |
          set -euo pipefail

          # Kiểm tra Docker credentials
          : "${DOCKER_USERNAME:?Missing DOCKER_USERNAME}"
          : "${DOCKER_PASSWORD:?Missing DOCKER_PASSWORD}"

          # Tạo file credentials tạm
          umask 077
          printf '%s\n%s\n' "$DOCKER_USERNAME" "$DOCKER_PASSWORD" > .docker-auth

          # Upload credentials lên VPS
          scp -P "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            .docker-auth \
            "$VPS_USERNAME@$VPS_HOST:~/"

          # Tạo deploy script
          cat << 'EOF' > deploy_script.sh
          set -euo pipefail

          # Đăng nhập Docker Hub trên VPS
          cd ~/apps/chat-app

          AUTH_FILE="$HOME/.docker-auth"
          trap 'rm -f "$AUTH_FILE"' EXIT

          IFS= read -r DOCKER_USERNAME < "$AUTH_FILE"
          IFS= read -r DOCKER_PASSWORD < <(sed -n '2p' "$AUTH_FILE")

          echo "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" \
            --password-stdin

          unset DOCKER_PASSWORD

          echo "Docker login successful!"

          # Pull image mới
          echo "Pulling latest images..."
          docker compose pull

          # Deploy
          echo "Deploying containers..."
          docker compose up -d

          # Kiểm tra container
          docker compose ps

          # Dọn image cũ sau khi deploy thành công
          docker image prune -f

          echo "Deployment completed!"
          EOF

          # Thực thi SSH
          ssh -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            -o PasswordAuthentication=no \
            "$VPS_USERNAME@$VPS_HOST" \
            'bash -s' < deploy_script.sh

          # Xóa credentials tạm trên GitHub Runner
          rm -f .docker-auth deploy_script.sh
