name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. BUILD & PUSH CLIENT
      - name: Build and push Client Docker image
        run: |
          docker build --pull --no-cache \
            --build-arg REACT_APP_API_ROOT="${{ secrets.REACT_APP_API_ROOT }}" \
            --build-arg CLIENT_URL="${{ secrets.CLIENT_URL }}" \
            -t nivz0911/chat-socketio-client:latest ./client
          docker push nivz0911/chat-socketio-client:latest

      # 2. BUILD & PUSH SERVER
      - name: Build and push Server Docker image
        run: |
          docker build --pull --no-cache -t nivz0911/chat-socketio-server:latest ./server
          docker push nivz0911/chat-socketio-server:latest

      # 3. DEPLOY LÊN VPS
      - name: Deploy to VPS via SSH
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          REACT_APP_API_ROOT: ${{ secrets.REACT_APP_API_ROOT }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          cat << 'EOF' > deploy_script.sh
          # Đăng nhập Docker Hub trên VPS
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

          # Đi đúng vào thư mục dự án trên VPS của bạn
          cd ~/apps/chat-app || exit 1

          # TỰ ĐỘNG TẠO FILE .ENV TRÊN VPS TỪ CÁC BIẾN GITHUB SECRETS
          cat << EOT > .env
          MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD
          JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
          COOKIE_SECURE=$COOKIE_SECURE
          REACT_APP_API_ROOT=$REACT_APP_API_ROOT
          CLIENT_URL=$CLIENT_URL
          EOT

          # Kéo image mới và deploy qua docker compose
          docker compose pull
          docker compose up -d --force-recreate

          # Dọn dẹp rác image cũ
          docker image prune -f
          EOF

          # Thực thi SSH đúng chuẩn port 2222 và user token của VPS
          ssh -o StrictHostKeyChecking=no \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -p $VPS_PORT \
              $VPS_USERNAME@$VPS_HOST 'bash -s' < deploy_script.sh
