services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the root .env file}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  server:
    build:
      context: ./server
    environment:
      CLIENT_URL: http://localhost:3000
      PORT: 5000
      DB_HOST: db
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the root .env file}
      DB_NAME: ChatDb
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        REACT_APP_API_ROOT: ${REACT_APP_API_ROOT:-http://localhost:5000}
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  sqlserver_data:
